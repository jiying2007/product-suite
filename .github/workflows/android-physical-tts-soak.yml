name: Android Physical TTS Soak

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Immutable source tag or exact commit SHA to soak"
        required: true
        type: string
      mode:
        description: "TTS long-session surface"
        required: true
        default: "background"
        type: choice
        options:
          - "background"
          - "foreground-continuous"
          - "foreground-continuous-stress"
      duration_minutes:
        description: "TTS soak duration"
        required: true
        default: "30"
        type: choice
        options:
          - "30"
          - "60"

permissions:
  contents: read

concurrency:
  group: android-physical-tts-soak
  cancel-in-progress: false

jobs:
  tts-soak:
    runs-on: [self-hosted, android, physical]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - id: source
        name: Record exact source
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "TTS soaking source_ref=${{ inputs.source_ref }} sha=$SHA"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run physical background TTS soak
        env:
          JINGDU_QUALIFIED_SOURCE_REF: ${{ inputs.source_ref }}
          JINGDU_QUALIFIED_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          JINGDU_TTS_SOAK_MINUTES: ${{ inputs.duration_minutes }}
          JINGDU_TTS_SOAK_MODE: ${{ inputs.mode }}
        run: bash ./scripts/run-android-physical-tts-soak.sh
      - name: Preserve physical TTS soak evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tts-physical-soak-${{ inputs.mode }}-${{ inputs.duration_minutes }}m-${{ steps.source.outputs.sha }}
          path: apps/jingdu/android/macrobenchmark/build/outputs/physical-tts-soak/
          if-no-files-found: warn
          retention-days: 30
