name: CI Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify Reader performance gate ownership
        shell: bash
        run: |
          set -euo pipefail
          main=.github/workflows/ci.yml
          pr=.github/workflows/reader-performance-pr.yml

          test -f "$main"
          test -f "$pr"

          grep -Fq -- "if: github.event_name == 'push'" "$main"
          grep -Fq -- 'bash ./scripts/run-android-macrobenchmark-ci.sh' "$main"
          grep -Fq -- 'bash ./scripts/run-android-macrobenchmark-ci.sh' "$pr"
          grep -Fq -- "- 'apps/jingdu/**'" "$pr"
          grep -Fq -- "- 'platform/**'" "$pr"
          grep -Fq -- "- 'native/**'" "$pr"
          grep -Fq -- "- 'scripts/run-android-macrobenchmark-ci.sh'" "$pr"
          grep -Fq -- "- 'scripts/check-android-performance-slo.py'" "$pr"

          if grep -Fq -- "- '.github/workflows/" "$pr"; then
            echo 'Reader PR performance must not be self-triggered by workflow-scope-only changes' >&2
            exit 1
          fi

          grep -Fq -- 'android-performance' "$main"
          grep -Fq -- 'needs: [repository-topology, native-core, android, android-functional, android-native-compat, android-performance, harmony-contract, play-store-contract, terminal-contract]' "$main"

      - name: Verify Pose Studio candidate release contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/pose-studio-candidate-release.yml
          publisher=apps/pose-studio/scripts/publish-candidate-release.py
          manifest=apps/pose-studio/releases/pose-studio-v0.2.1.md

          test -f "$workflow"
          test -f "$publisher"
          test -f "$manifest"
          python3 -m py_compile "$publisher"

          grep -Fq -- 'workflows: ["CI", "Pose Studio", "CI Contracts"]' "$workflow"
          grep -Fq -- "github.event.workflow_run.event == 'push'" "$workflow"
          grep -Fq -- "github.event.workflow_run.head_branch == 'main'" "$workflow"
          grep -Fq -- 'ref: ${{ github.event.workflow_run.head_sha }}' "$workflow"
          grep -Fq -- 'contents: write' "$workflow"
          grep -Fq -- 'actions: read' "$workflow"
          grep -Fq -- 'CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}' "$workflow"
          grep -Fq -- 'python3 apps/pose-studio/scripts/publish-candidate-release.py' "$workflow"

          grep -Fq -- 'REQUIRED_WORKFLOWS = ("CI", "Pose Studio", "CI Contracts")' "$publisher"
          grep -Fq -- 'pose-studio-v{version}' "$publisher"
          grep -Fq -- 'main_sha() != CANDIDATE_SHA' "$publisher"
          grep -Fq -- '"draft": True' "$publisher"
          grep -Fq -- '"prerelease": True' "$publisher"
          grep -Fq -- 'production-v1: false' "$publisher"
          grep -Fq -- 'production-signing-proven: false' "$publisher"
          grep -Fq -- 'google-play-production: false' "$publisher"

          grep -Fq -- 'version: pose-studio-v0.2.1' "$manifest"
          grep -Fq -- 'android_version_name: 0.2.1' "$manifest"
          grep -Fq -- 'android_version_code: 3' "$manifest"
          grep -Fq -- 'production_v1: false' "$manifest"
          grep -Fq -- 'production_signing_proven: false' "$manifest"
          grep -Fq -- 'google_play_production: false' "$manifest"

      - name: Verify Pose Studio commercial-beta distribution contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/pose-studio-beta-release.yml
          test -f "$workflow"

          grep -Fq -- 'workflows: ["CI Contracts"]' "$workflow"
          grep -Fq -- "github.event.workflow_run.event == 'push'" "$workflow"
          grep -Fq -- "github.event.workflow_run.head_branch == 'main'" "$workflow"
          grep -Fq -- "github.event.workflow_run.conclusion == 'success'" "$workflow"
          grep -Fq -- 'contents: write' "$workflow"
          grep -Fq -- 'TAG: pose-studio-v0.2.1' "$workflow"
          grep -Fq -- 'EXPECTED_CANDIDATE_SHA: da999c8432bcc447d12123e55bdbb84d24e9583b' "$workflow"
          grep -Fq -- 'EXPECTED_MANIFEST_SHA256: 6ec5c4b3589735933155042764f492abfa663aa7d3fb652afdcffb21c65c657f' "$workflow"
          grep -Fq -- 'EXPECTED_KEYSTORE_SHA256: b327cb3fd3bf5eeaeb3958737335180f5b8c664d47429fd1b9eb08d32e178a56' "$workflow"
          grep -Fq -- 'EXPECTED_CERT_SHA256: 2618e7889486adea5fc083f7cb5155f2ec629baf5dae2a74dabc3abe5cd02a94' "$workflow"
          grep -Fq -- 'validatePoseReleaseSigning assembleRelease' "$workflow"
          grep -Fq -- 'PoseStudio-v0.2.1-commercial-beta-debug-signed.apk' "$workflow"
          grep -Fq -- 'production_signing_proven: false' "$workflow"
          grep -Fq -- 'google_play_production: false' "$workflow"
          grep -Fq -- 'pre-production commercial-beta distribution only' "$workflow"
          grep -Fq -- 'POSE-STUDIO-SHA256SUMS.txt' "$workflow"
          grep -Fq -- 'POSE-STUDIO-SIGNING-CERT-SHA256.txt' "$workflow"
          grep -Fq -- 'POSE-STUDIO-SOURCE-SHA.txt' "$workflow"
          grep -Fq -- '{draft:false, prerelease:true, make_latest:"false", body:$body}' "$workflow"

          if grep -Fq -- 'bundleRelease' "$workflow"; then
            echo 'Commercial-beta GitHub distribution must not publish a Play-style AAB' >&2
            exit 1
          fi
