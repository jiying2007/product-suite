name: CI Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify Reader performance gate ownership
        shell: bash
        run: |
          set -euo pipefail
          main=.github/workflows/ci.yml
          pr=.github/workflows/reader-performance-pr.yml
          scope=scripts/reader-performance-scope.py

          test -f "$main"
          test -f "$pr"
          test -f "$scope"
          python3 -m py_compile "$scope"

          grep -Fq -- "if: github.event_name == 'push'" "$main"
          grep -Fq -- 'fetch-depth: 2' "$main"
          grep -Fq -- 'python3 scripts/reader-performance-scope.py' "$main"
          grep -Fq -- "if: steps.reader-performance-scope.outputs.run == 'true'" "$main"
          grep -Fq -- 'bash ./scripts/run-android-macrobenchmark-ci.sh' "$main"
          grep -Fq -- 'bash ./scripts/run-android-macrobenchmark-ci.sh' "$pr"
          grep -Fq -- "- 'apps/jingdu/android/**'" "$pr"
          grep -Fq -- "- '!apps/jingdu/android/.gitignore'" "$pr"
          grep -Fq -- "- '!apps/jingdu/android/**/*.md'" "$pr"
          grep -Fq -- "- '!apps/jingdu/android/app/src/androidTest/**'" "$pr"
          grep -Fq -- "- '!apps/jingdu/android/app/src/test/**'" "$pr"
          test "$(python3 "$scope" apps/jingdu/android/app/src/androidTest/java/com/junchen/jingdu/JingduUiTest.kt)" = false
          test "$(python3 "$scope" apps/jingdu/android/app/src/test/java/com/junchen/jingdu/ReaderFoundationsTest.kt)" = false
          test "$(python3 "$scope" .github/workflows/ci.yml)" = false
          test "$(python3 "$scope" apps/jingdu/android/app/src/main/java/com/junchen/jingdu/ReaderScreen.kt)" = true
          test "$(python3 "$scope" apps/jingdu/android/app/build.gradle)" = true
          test "$(python3 "$scope" platform/text/native/reader_core.cpp)" = true
          test "$(python3 "$scope" scripts/run-android-macrobenchmark-ci.sh)" = true
          if grep -Fq -- "- 'apps/jingdu/**'" "$pr"; then
            echo 'Reader PR performance scope is too broad; product-level docs must not start emulator qualification' >&2
            exit 1
          fi
          grep -Fq -- "- 'platform/**'" "$pr"
          grep -Fq -- "- 'native/**'" "$pr"
          grep -Fq -- "- 'scripts/run-android-macrobenchmark-ci.sh'" "$pr"
          grep -Fq -- "- 'scripts/check-android-performance-slo.py'" "$pr"

          if grep -Fq -- "- '.github/workflows/" "$pr"; then
            echo 'Reader PR performance must not be self-triggered by workflow-scope-only changes' >&2
            exit 1
          fi

          grep -Fq -- 'python3 scripts/verify-android-third-party-inventory.py' "$main"
          grep -Fq -- 'android-performance' "$main"
          grep -Fq -- 'needs: [repository-topology, native-core, android, android-functional, android-native-compat, android-performance, harmony-contract, play-store-contract, terminal-contract]' "$main"

      - name: Verify Jingdu release branch cleanup contract
        shell: bash
        run: |
          set -euo pipefail
          publisher=scripts/publish-source-release.py
          test -f "$publisher"
          python3 -m py_compile "$publisher"
          grep -Fq -- 'RELEASE_PREFIXES = ("release/source-v", "release/jingdu-", "release/pose-studio-")' "$publisher"
      - name: Verify Pose Studio candidate release contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/pose-studio-candidate-release.yml
          publisher=apps/pose-studio/scripts/publish-candidate-release.py
          build=apps/pose-studio/android/app/build.gradle

          test -f "$workflow"
          test -f "$publisher"
          test -f "$build"
          python3 -m py_compile "$publisher"

          version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' "$build" | head -n 1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' "$build" | head -n 1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$version_code" =~ ^[0-9]+$ ]]
          tag="pose-studio-v${version}"
          manifest="apps/pose-studio/releases/${tag}.md"
          test -f "$manifest"

          grep -Fq -- 'workflows: ["Pose Studio"]' "$workflow"
          if grep -Fq -- 'workflows: ["CI", "Pose Studio", "CI Contracts"]' "$workflow"; then
            echo 'Pose Studio candidate workflow must not fan out from generic CI workflows' >&2
            exit 1
          fi
          grep -Fq -- "github.event.workflow_run.event == 'push'" "$workflow"
          grep -Fq -- "github.event.workflow_run.head_branch == 'main'" "$workflow"
          grep -Fq -- 'ref: ${{ github.event.workflow_run.head_sha }}' "$workflow"
          grep -Fq -- 'contents: write' "$workflow"
          grep -Fq -- 'actions: read' "$workflow"
          grep -Fq -- 'CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}' "$workflow"
          grep -Fq -- 'python3 apps/pose-studio/scripts/publish-candidate-release.py' "$workflow"

          grep -Fq -- 'REQUIRED_WORKFLOWS = ("CI", "Pose Studio", "CI Contracts")' "$publisher"
          grep -Fq -- 'pose-studio-v{version}' "$publisher"
          grep -Fq -- 'main_sha() != CANDIDATE_SHA' "$publisher"
          grep -Fq -- '"draft": True' "$publisher"
          grep -Fq -- '"prerelease": True' "$publisher"
          grep -Fq -- 'production-v1: false' "$publisher"
          grep -Fq -- 'production-signing-proven: false' "$publisher"
          grep -Fq -- 'google-play-production: false' "$publisher"

          grep -Fxq -- "version: $tag" "$manifest"
          grep -Fxq -- "android_version_name: $version" "$manifest"
          grep -Fxq -- "android_version_code: $version_code" "$manifest"
          grep -Fxq -- 'production_v1: false' "$manifest"
          grep -Fxq -- 'production_signing_proven: false' "$manifest"
          grep -Fxq -- 'google_play_production: false' "$manifest"

      - name: Verify retired Pose Studio commercial-beta lock contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/pose-studio-beta-release.yml
          lock=apps/pose-studio/releases/commercial-beta.lock.env
          docs=apps/pose-studio/docs/RELEASE.md

          test ! -e "$workflow"
          test -f "$lock"
          test -f "$docs"

          expected_keys="APK_NAME EXPECTED_CANDIDATE_SHA EXPECTED_CERT_SHA256 EXPECTED_KEYSTORE_SHA256 EXPECTED_MANIFEST_SHA256 TAG VERSION_CODE VERSION_NAME"
          actual_keys="$(grep -Ev '^[[:space:]]*(#|$)' "$lock" | cut -d= -f1 | sort | xargs)"
          test "$actual_keys" = "$expected_keys"

          set -a
          # shellcheck disable=SC1090
          source "$lock"
          set +a

          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_KEYSTORE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$TAG" = "pose-studio-v$VERSION_NAME"
          test "$APK_NAME" = "PoseStudio-v${VERSION_NAME}-commercial-beta-debug-signed.apk"

          manifest="apps/pose-studio/releases/${TAG}.md"
          test -f "$manifest"
          test "$(sha256sum "$manifest" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          grep -Fxq -- "version: $TAG" "$manifest"
          grep -Fxq -- "android_version_name: $VERSION_NAME" "$manifest"
          grep -Fxq -- "android_version_code: $VERSION_CODE" "$manifest"
          grep -Fxq -- 'production_v1: false' "$manifest"
          grep -Fxq -- 'production_signing_proven: false' "$manifest"
          grep -Fxq -- 'google_play_production: false' "$manifest"

          grep -Fq -- 'commercial-beta publication workflow is retired' "$docs"
          grep -Fq -- 'commercial-beta.lock.env' "$docs"
