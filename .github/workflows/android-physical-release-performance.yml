name: Android Physical Release Performance

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Immutable source tag or exact commit SHA to qualify (for example v2.3.4)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-physical-release-performance
  cancel-in-progress: false

jobs:
  reader-release-performance:
    runs-on: [self-hosted, android, physical]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - id: source
        name: Record exact qualified source
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Qualifying source_ref=${{ inputs.source_ref }} sha=$SHA"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Qualify Reader on physical Android release device
        env:
          JINGDU_QUALIFIED_SOURCE_REF: ${{ inputs.source_ref }}
          JINGDU_QUALIFIED_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: bash ./scripts/run-android-physical-release-performance.sh
      - name: Preserve physical release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-physical-release-${{ steps.source.outputs.sha }}
          path: apps/jingdu/android/macrobenchmark/build/outputs/physical-release/
          if-no-files-found: warn
          retention-days: 30
