name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify product-suite topology
        run: ./scripts/verify-repository-topology.sh

  native-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build, test and analyze shared core
        run: ./scripts/check-native.sh

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/jingdu/android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android product verification
        run: ./gradlew --no-daemon --warning-mode all androidCheck
      - name: Print complete Android lint failures
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(
            app/build/intermediates/lint_intermediate_text_report/*/*/lint-results-*.txt
            app/build/reports/lint-results-*.txt
          )
          if ((${#reports[@]})); then
            for report in "${reports[@]}"; do
              echo "===== ${report} ====="
              cat "$report"
            done
          else
            echo "No lint text report was produced; failure occurred before lint reporting."
          fi
      - name: Android Reader and localization contract
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-android-i18n.py
          bash ./scripts/verify-reader.sh
          python3 -m py_compile scripts/check-android-performance-slo.py
          bash -n scripts/run-android-macrobenchmark-ci.sh
          bash -n scripts/run-android-functional-tests-ci.sh
          bash -n scripts/verify-android-16k-page-size.sh

  android-functional:
    needs: android
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Execute Android UI and local-asset instrumentation tests
        run: bash ./scripts/run-android-functional-tests-ci.sh
      - name: Preserve Android functional-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-functional-${{ github.sha }}
          path: |
            apps/jingdu/android/app/build/reports/androidTests/
            apps/jingdu/android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/jingdu-functional-emulator.log
            ${{ runner.temp }}/jingdu-functional-font-scale-200.log
          if-no-files-found: warn
          retention-days: 14

  android-native-compat:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify 16 KiB native page-size packaging and symbols
        run: bash ./scripts/verify-android-16k-page-size.sh

  android-performance:
    if: github.event_name == 'push'
    needs: android
    # Exact-main remains the mandatory hosted Reader regression gate. Pull requests run the same
    # job from reader-performance-pr.yml only when Jingdu/shared performance paths change.
    # Emulator timing is guarded by the checked-in baseline + 15% budget and 160/220 anti-drift
    # ceilings; 40/80 is exclusively the physical-device Release SLO.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run Reader hosted Macrobenchmark and enforce frame SLO
        run: bash ./scripts/run-android-macrobenchmark-ci.sh
      - name: Preserve Macrobenchmark evidence and failure Perfetto traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-macrobenchmark-${{ github.sha }}
          path: |
            apps/jingdu/android/macrobenchmark/build/outputs/
            ${{ runner.temp }}/jingdu-emulator.log
          if-no-files-found: warn
          retention-days: 14

  harmony-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Harmony terminal contract
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/jingdu/harmony/build-profile.json5
          test -f apps/jingdu/harmony/entry/build-profile.json5
          test -f apps/jingdu/harmony/entry/src/main/module.json5
          test -f apps/jingdu/harmony/entry/src/main/cpp/napi_init.cpp
          test -f apps/jingdu/harmony/entry/src/main/ets/pages/Index.ets
          test -f apps/jingdu/harmony/entry/src/main/ets/model/BookStore.ets
          test -f apps/jingdu/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          test -f apps/jingdu/harmony/entry/src/main/ets/model/ReaderController.ets
          test -f apps/jingdu/harmony/entry/src/main/ets/model/TtsController.ets
          grep -q 'platform/text/native' apps/jingdu/harmony/entry/src/main/cpp/CMakeLists.txt
          grep -q 'abiVersion() !== 2' apps/jingdu/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          grep -q '@Concurrent' apps/jingdu/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          grep -q 'openDocumentTask' apps/jingdu/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          grep -q 'document-${normalizedSha256}.txt' apps/jingdu/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          grep -q 'clean-${revision}.txt' apps/jingdu/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          grep -q "name.endsWith('.jdx')" apps/jingdu/harmony/entry/src/main/ets/model/BackgroundTasks.ets
          grep -q 'await this.reader.open' apps/jingdu/harmony/entry/src/main/ets/pages/Index.ets
          grep -q 'DocumentViewPicker' apps/jingdu/harmony/entry/src/main/ets/pages/Index.ets

  play-store-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Play metadata and lifetime Pro contract
        run: bash ./scripts/verify-play-store.sh

  terminal-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify terminal source and long-form quality contracts
        run: |
          set -euo pipefail
          python3 ./scripts/verify-android-source-conventions.py
          ./scripts/verify-terminal.sh
          bash ./scripts/verify-terminal-quality.sh

  publish-source-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [repository-topology, native-core, android, android-functional, android-native-compat, android-performance, harmony-contract, play-store-contract, terminal-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Publish immutable source release and prune closed temporary branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
          MAIN_SHA: ${{ github.sha }}
        run: python3 ./scripts/publish-source-release.py

  publish-android-debug-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-source-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Publish stable-debug-key APK from immutable source tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('apps/jingdu/android/app/build.gradle').read_text(encoding='utf-8')
          match = re.search(r'versionNameProperty\.getOrElse\("([^\"]+)"\)', text)
          if not match:
              raise SystemExit('Android versionName default not found')
          print(match.group(1))
          PY
          )"
          TAG="v${VERSION}"
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          test -n "$TAG_SHA"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

          KEYSTORE_SOURCE="config/signing/android-debug.keystore"
          KEYSTORE="$RUNNER_TEMP/android-debug.keystore"
          test "$(sha256sum "$KEYSTORE_SOURCE" | awk '{print $1}')" = "b327cb3fd3bf5eeaeb3958737335180f5b8c664d47429fd1b9eb08d32e178a56"
          cp "$KEYSTORE_SOURCE" "$KEYSTORE"
          keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey > "$RUNNER_TEMP/keytool.txt"
          KEY_CERT_SHA="$(sed -n 's/.*SHA256: //p' "$RUNNER_TEMP/keytool.txt" | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$KEY_CERT_SHA" = "2618e7889486adea5fc083f7cb5155f2ec629baf5dae2a74dabc3abe5cd02a94"

          APK_NAME="Jingdu-v${VERSION}-debug-signed.apk"
          EXISTING_ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if grep -Fxq "$APK_NAME" <<<"$EXISTING_ASSETS" \
            && grep -Fxq "SHA256SUMS.txt" <<<"$EXISTING_ASSETS" \
            && grep -Fxq "SIGNING-CERT-SHA256.txt" <<<"$EXISTING_ASSETS"; then
            echo "debug-signed APK assets already published for $TAG"
            exit 0
          fi

          git checkout --detach "$TAG_SHA"
          test -f "releases/source/${TAG}.md"
          grep -Fxq "version: ${TAG}" "releases/source/${TAG}.md"
          ANDROID_ROOT="apps/jingdu/android"
          test -f "$ANDROID_ROOT/app/build.gradle"
          VERSION_CODE="$(ANDROID_ROOT="$ANDROID_ROOT" python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path(os.environ['ANDROID_ROOT'], 'app', 'build.gradle').read_text(encoding='utf-8')
          match = re.search(r'versionCodeProperty\.map \{ Integer\.parseInt\(it\) \}\.getOrElse\((\d+)\)', text)
          if not match:
              raise SystemExit('Android versionCode default not found')
          print(match.group(1))
          PY
          )"

          cat > "$ANDROID_ROOT/keystore.properties" <<EOF
          storeFile=$KEYSTORE
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

          cd "$ANDROID_ROOT"
          ./gradlew --no-daemon --no-configuration-cache --warning-mode all \
            -PjingduApplicationId=com.junchen.jingdu \
            -PjingduVersionCode="$VERSION_CODE" \
            -PjingduVersionName="$VERSION" \
            validateStoreRelease assembleRelease

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          APK_CERT_SHA="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test -n "$APK_CERT_SHA"
          test "$APK_CERT_SHA" = "$KEY_CERT_SHA"

          mkdir -p "$RUNNER_TEMP/jingdu-release"
          OUT="$RUNNER_TEMP/jingdu-release/$APK_NAME"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | sed "s#  .*#  $APK_NAME#" > "$RUNNER_TEMP/jingdu-release/SHA256SUMS.txt"
          printf '%s\n' "$APK_CERT_SHA" > "$RUNNER_TEMP/jingdu-release/SIGNING-CERT-SHA256.txt"

          gh release upload "$TAG" \
            "$OUT" \
            "$RUNNER_TEMP/jingdu-release/SHA256SUMS.txt" \
            "$RUNNER_TEMP/jingdu-release/SIGNING-CERT-SHA256.txt" \
            --repo "$GITHUB_REPOSITORY" --clobber

          BODY="$RUNNER_TEMP/release-body.md"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$BODY"
          if ! grep -Fq "$APK_NAME" "$BODY"; then
            {
              printf '\n## Android APK\n\n'
              printf '`%s` is built from the immutable `%s` source tag and signed with the repository-stable Android debug key (`androiddebugkey`) used for the current pre-production stage. `SHA256SUMS.txt` and `SIGNING-CERT-SHA256.txt` are published alongside it.\n\n' "$APK_NAME" "$TAG"
              printf 'This downloadable APK is **not Google Play production signing or rollout evidence**.\n'
            } >> "$BODY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$BODY"
          fi

          FINAL_ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Fxq "$APK_NAME" <<<"$FINAL_ASSETS"
          grep -Fxq "SHA256SUMS.txt" <<<"$FINAL_ASSETS"
          grep -Fxq "SIGNING-CERT-SHA256.txt" <<<"$FINAL_ASSETS"
