name: Harmony Device Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact source tag, branch or commit SHA to build"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  build-harmony:
    runs-on: [self-hosted, harmonyos]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Record exact qualified source
        shell: bash
        run: |
          set -euo pipefail
          echo "Harmony source_ref=${{ inputs.source_ref }} sha=$(git rev-parse HEAD)"
      - name: Build HarmonyOS app
        run: ./scripts/check-harmony.sh
      - name: Collect HAP/APP/native artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/harmony-artifacts
          find apps/jingdu/harmony -type f \( -name '*.hap' -o -name '*.app' -o -name '*.so' \) \
            -print -exec cp --parents {} build/harmony-artifacts/ \;
          test -n "$(find build/harmony-artifacts -type f -name '*.hap' -print -quit)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harmony-build-${{ github.sha }}
          path: build/harmony-artifacts
          if-no-files-found: error
          retention-days: 14
