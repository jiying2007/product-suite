name: Pose Studio Physical Release Qualification

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact immutable candidate ref or commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  physical-release:
    runs-on: [self-hosted, android, pose-studio-release]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Qualify physical device with product-specific release signing
        shell: bash
        env:
          POSE_STUDIO_RELEASE_KEYSTORE_BASE64: ${{ secrets.POSE_STUDIO_RELEASE_KEYSTORE_BASE64 }}
          POSE_STUDIO_RELEASE_STORE_PASSWORD: ${{ secrets.POSE_STUDIO_RELEASE_STORE_PASSWORD }}
          POSE_STUDIO_RELEASE_KEY_ALIAS: ${{ secrets.POSE_STUDIO_RELEASE_KEY_ALIAS }}
          POSE_STUDIO_RELEASE_KEY_PASSWORD: ${{ secrets.POSE_STUDIO_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${POSE_STUDIO_RELEASE_KEYSTORE_BASE64:-}"
          test -n "${POSE_STUDIO_RELEASE_STORE_PASSWORD:-}"
          test -n "${POSE_STUDIO_RELEASE_KEY_ALIAS:-}"
          test -n "${POSE_STUDIO_RELEASE_KEY_PASSWORD:-}"

          KEYSTORE="$RUNNER_TEMP/pose-studio-release.keystore"
          trap 'rm -f "$KEYSTORE"' EXIT
          python3 - "$KEYSTORE" <<'PY'
          import base64
          import os
          from pathlib import Path
          import sys

          encoded = os.environ["POSE_STUDIO_RELEASE_KEYSTORE_BASE64"].strip()
          Path(sys.argv[1]).write_bytes(base64.b64decode(encoded, validate=True))
          PY
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          export POSE_STUDIO_RELEASE_STORE_FILE="$KEYSTORE"

          bash apps/pose-studio/scripts/physical-release-check.sh "${{ inputs.source_ref }}"
      - name: Preserve physical release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pose-studio-physical-${{ github.run_id }}
          path: apps/pose-studio/evidence/physical/
          if-no-files-found: error
          retention-days: 90
