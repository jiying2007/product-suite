name: Pose Studio Physical Release Qualification

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact immutable candidate ref or commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  physical-release:
    runs-on: [self-hosted, android, pose-studio-release]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Qualify physical device
        run: bash apps/pose-studio/scripts/physical-release-check.sh "${{ inputs.source_ref }}"
      - name: Preserve physical release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pose-studio-physical-${{ inputs.source_ref }}
          path: apps/pose-studio/evidence/physical/
          if-no-files-found: error
          retention-days: 90
