name: Android Physical Reader Soak

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Immutable source tag or exact commit SHA to soak"
        required: true
        type: string
      mode:
        description: "Long-session Reader surface"
        required: true
        default: "paged"
        type: choice
        options:
          - "paged"
          - "continuous-stress"
      duration_minutes:
        description: "Long-session duration"
        required: true
        default: "60"
        type: choice
        options:
          - "60"
          - "180"

permissions:
  contents: read

concurrency:
  group: android-physical-reader-soak
  cancel-in-progress: false

jobs:
  reader-soak:
    runs-on: [self-hosted, android, physical]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - id: source
        name: Record exact source
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Soaking source_ref=${{ inputs.source_ref }} sha=$SHA"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run physical long-session Reader soak
        env:
          JINGDU_QUALIFIED_SOURCE_REF: ${{ inputs.source_ref }}
          JINGDU_QUALIFIED_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          JINGDU_SOAK_MINUTES: ${{ inputs.duration_minutes }}
          JINGDU_SOAK_MODE: ${{ inputs.mode }}
        run: bash ./scripts/run-android-physical-reader-soak.sh
      - name: Preserve physical soak evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-physical-soak-${{ inputs.mode }}-${{ inputs.duration_minutes }}m-${{ steps.source.outputs.sha }}
          path: apps/jingdu/android/macrobenchmark/build/outputs/physical-soak/
          if-no-files-found: warn
          retention-days: 30
