name: One-shot topology reference migration

on:
  push:
    branches:
      - refactor/product-suite-topology

permissions:
  contents: write

concurrency:
  group: one-shot-topology-reference-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[topology-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refactor/product-suite-topology
          fetch-depth: 0
      - name: Rewrite tracked text references deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          mappings = {
              "apps/" + "android": "apps/jingdu/android",
              "apps/" + "harmony": "apps/jingdu/harmony",
              "core/" + "native": "platform/text/native",
              "jiying2007/" + "llm_apps": "jiying2007/product-suite",
          }
          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          changed = []
          for raw in paths:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in mappings.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))
          print("\n".join(changed))
          PY
          if git diff --quiet; then
            echo "No legacy topology references remain."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "refactor(repo): rewrite legacy topology references [topology-migrated]"
          git push origin HEAD:refactor/product-suite-topology
