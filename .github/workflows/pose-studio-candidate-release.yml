name: Pose Studio Candidate Release

on:
  workflow_run:
    workflows: ["CI", "Pose Studio", "CI Contracts"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  freeze-candidate:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - name: Freeze Pose Studio candidate after all exact-main gates are green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' \
            apps/pose-studio/android/app/build.gradle | head -n 1)"
          test -n "$version"
          tag="pose-studio-v${version}"

          # A released/frozen semver is immutable. Later main commits may still carry
          # that development version; they must not turn the intentional freeze into
          # a red workflow or move the existing tag. A future candidate requires a
          # version bump, while a tag-without-release inconsistency still falls
          # through to the fail-closed publisher for diagnosis.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1 && \
             gh api --silent "/repos/$GH_REPOSITORY/releases/tags/$tag"; then
            echo "Pose Studio candidate already frozen for $tag; current main remains development-only until version is bumped."
            exit 0
          fi

          python3 apps/pose-studio/scripts/publish-candidate-release.py
