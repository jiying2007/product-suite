name: Reader Performance PR

on:
  pull_request:
    paths:
      # Reader performance is owned by executable Android/product paths, shared runtime code and
      # the benchmark/SLO implementation itself. Product-level docs and ignored signing files
      # must not occupy a hosted emulator.
      - 'apps/jingdu/android/**'
      - '!apps/jingdu/android/.gitignore'
      - '!apps/jingdu/android/**/*.md'
      - '!apps/jingdu/android/app/src/androidTest/**'
      - '!apps/jingdu/android/app/src/test/**'
      - 'platform/**'
      - 'native/**'
      - 'scripts/run-android-macrobenchmark-ci.sh'
      - 'scripts/check-android-performance-slo.py'

permissions:
  contents: read

concurrency:
  group: reader-performance-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-performance:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run Reader hosted Macrobenchmark and enforce frame SLO
        run: bash ./scripts/run-android-macrobenchmark-ci.sh
      - name: Preserve Macrobenchmark evidence and failure Perfetto traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-macrobenchmark-pr-${{ github.sha }}
          path: |
            apps/jingdu/android/macrobenchmark/build/outputs/
            ${{ runner.temp }}/jingdu-emulator.log
          if-no-files-found: warn
          retention-days: 14
