name: Reader Performance PR

on:
  pull_request:
    paths:
      - 'apps/jingdu/**'
      - 'platform/**'
      - 'native/**'
      - 'scripts/run-android-macrobenchmark-ci.sh'
      - 'scripts/check-android-performance-slo.py'

permissions:
  contents: read

concurrency:
  group: reader-performance-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-performance:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run Reader hosted Macrobenchmark and enforce frame SLO
        run: bash ./scripts/run-android-macrobenchmark-ci.sh
      - name: Preserve Macrobenchmark evidence and failure Perfetto traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-macrobenchmark-pr-${{ github.sha }}
          path: |
            apps/jingdu/android/macrobenchmark/build/outputs/
            ${{ runner.temp }}/jingdu-emulator.log
          if-no-files-found: warn
          retention-days: 14
