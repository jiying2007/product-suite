name: Pose Studio Beta Release

on:
  workflow_run:
    workflows: ["CI Contracts"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish-commercial-beta:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check immutable commercial-beta release state
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK: apps/pose-studio/releases/commercial-beta.lock.env
        run: |
          set -euo pipefail
          test -f "$LOCK"
          set -a
          # shellcheck disable=SC1090
          source "$LOCK"
          set +a

          test "$TAG" = "pose-studio-v$VERSION_NAME"
          test "$APK_NAME" = "PoseStudio-v${VERSION_NAME}-commercial-beta-debug-signed.apk"

          RELEASE_ID="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == env.TAG) | .id' | head -n 1)"
          test -n "$RELEASE_ID"

          RELEASE_JSON="$RUNNER_TEMP/pose-studio-release.json"
          gh api "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RELEASE_JSON"
          test "$(jq -r '.tag_name' "$RELEASE_JSON")" = "$TAG"
          test "$(jq -r '.target_commitish' "$RELEASE_JSON")" = "$EXPECTED_CANDIDATE_SHA"
          test "$(jq -r '.prerelease' "$RELEASE_JSON")" = "true"

          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          test "$TAG_SHA" = "$EXPECTED_CANDIDATE_SHA"

          if [[ "$(jq -r '.draft' "$RELEASE_JSON")" == "false" ]]; then
            test "$(jq -r '.immutable // false' "$RELEASE_JSON")" = "true"
            mapfile -t existing_assets < <(jq -r '.assets[].name' "$RELEASE_JSON")
            printf '%s\n' "${existing_assets[@]}" | grep -Fxq "$APK_NAME"
            printf '%s\n' "${existing_assets[@]}" | grep -Fxq "POSE-STUDIO-SHA256SUMS.txt"
            printf '%s\n' "${existing_assets[@]}" | grep -Fxq "POSE-STUDIO-SIGNING-CERT-SHA256.txt"
            printf '%s\n' "${existing_assets[@]}" | grep -Fxq "POSE-STUDIO-SOURCE-SHA.txt"
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
            echo "Pose Studio commercial-beta prerelease is already immutable with complete assets"
            exit 0
          fi

          echo "needs_publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        if: steps.preflight.outputs.needs_publish == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Publish stable-debug-key Pose Studio commercial-beta APK
        if: steps.preflight.outputs.needs_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK: apps/pose-studio/releases/commercial-beta.lock.env
        run: |
          set -euo pipefail
          test -f "$LOCK"
          set -a
          # shellcheck disable=SC1090
          source "$LOCK"
          set +a

          RELEASE_ID="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == env.TAG) | .id' | head -n 1)"
          test -n "$RELEASE_ID"

          RELEASE_JSON="$RUNNER_TEMP/pose-studio-release.json"
          gh api "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RELEASE_JSON"
          test "$(jq -r '.draft' "$RELEASE_JSON")" = "true"
          test "$(jq -r '.tag_name' "$RELEASE_JSON")" = "$TAG"
          test "$(jq -r '.target_commitish' "$RELEASE_JSON")" = "$EXPECTED_CANDIDATE_SHA"
          test "$(jq -r '.prerelease' "$RELEASE_JSON")" = "true"

          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          test "$TAG_SHA" = "$EXPECTED_CANDIDATE_SHA"
          git checkout --detach "$TAG_SHA"

          MANIFEST="apps/pose-studio/releases/$TAG.md"
          test -f "$MANIFEST"
          test "$(sha256sum "$MANIFEST" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          grep -Fxq "version: $TAG" "$MANIFEST"
          grep -Fxq "android_version_name: $VERSION_NAME" "$MANIFEST"
          grep -Fxq "android_version_code: $VERSION_CODE" "$MANIFEST"
          grep -Fxq 'production_v1: false' "$MANIFEST"
          grep -Fxq 'production_signing_proven: false' "$MANIFEST"
          grep -Fxq 'google_play_production: false' "$MANIFEST"

          KEYSTORE_SOURCE="config/signing/android-debug.keystore"
          test -f "$KEYSTORE_SOURCE"
          test "$(sha256sum "$KEYSTORE_SOURCE" | awk '{print $1}')" = "$EXPECTED_KEYSTORE_SHA256"
          KEYSTORE="$RUNNER_TEMP/pose-studio-beta-debug.keystore"
          cp "$KEYSTORE_SOURCE" "$KEYSTORE"
          keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey > "$RUNNER_TEMP/pose-studio-keytool.txt"
          KEY_CERT_SHA="$(sed -n 's/.*SHA256: //p' "$RUNNER_TEMP/pose-studio-keytool.txt" | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$KEY_CERT_SHA" = "$EXPECTED_CERT_SHA256"

          ANDROID_ROOT="apps/pose-studio/android"
          cat > "$ANDROID_ROOT/keystore.properties" <<EOF
          storeFile=$KEYSTORE
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

          cd "$ANDROID_ROOT"
          ./gradlew --no-daemon --no-configuration-cache --warning-mode all \
            validatePoseReleaseSigning assembleRelease

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n1)"
          AAPT="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/pose-studio-apksigner.txt"
          APK_CERT_SHA="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/pose-studio-apksigner.txt" | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$APK_CERT_SHA" = "$EXPECTED_CERT_SHA256"

          BADGING="$($AAPT dump badging "$APK")"
          grep -Fq "package: name='com.junchen.posestudio' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<<"$BADGING"

          OUT_DIR="$RUNNER_TEMP/pose-studio-beta-release"
          mkdir -p "$OUT_DIR"
          cp "$APK" "$OUT_DIR/$APK_NAME"
          sha256sum "$OUT_DIR/$APK_NAME" | sed "s#  .*#  $APK_NAME#" > "$OUT_DIR/POSE-STUDIO-SHA256SUMS.txt"
          printf '%s\n' "$APK_CERT_SHA" > "$OUT_DIR/POSE-STUDIO-SIGNING-CERT-SHA256.txt"
          printf '%s\n' "$TAG_SHA" > "$OUT_DIR/POSE-STUDIO-SOURCE-SHA.txt"

          gh release upload "$TAG" \
            "$OUT_DIR/$APK_NAME" \
            "$OUT_DIR/POSE-STUDIO-SHA256SUMS.txt" \
            "$OUT_DIR/POSE-STUDIO-SIGNING-CERT-SHA256.txt" \
            "$OUT_DIR/POSE-STUDIO-SOURCE-SHA.txt" \
            --repo "$GITHUB_REPOSITORY" --clobber

          BODY="$RUNNER_TEMP/pose-studio-release-body.md"
          jq -r '.body' "$RELEASE_JSON" > "$BODY"
          if ! grep -Fq '## Installable commercial-beta APK' "$BODY"; then
            {
              printf '\n## Installable commercial-beta APK\n\n'
              printf '`%s` is built from immutable candidate `%s` (`%s`) using the repository-stable generic Android debug key.\n\n' "$APK_NAME" "$TAG" "$TAG_SHA"
              printf 'This APK is **pre-production commercial-beta distribution only**. The signing identity is intentionally the repository generic debug key, not a Pose-Studio-specific upload/release key, and therefore does **not** satisfy issue #83 production signing or Google Play evidence.\n\n'
              printf 'Published provenance files: `POSE-STUDIO-SHA256SUMS.txt`, `POSE-STUDIO-SIGNING-CERT-SHA256.txt`, and `POSE-STUDIO-SOURCE-SHA.txt`.\n'
            } >> "$BODY"
          fi

          PAYLOAD="$RUNNER_TEMP/pose-studio-release-publish.json"
          jq -n --rawfile body "$BODY" '{draft:false, prerelease:true, make_latest:"false", body:$body}' > "$PAYLOAD"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input "$PAYLOAD" > "$RELEASE_JSON"

          test "$(jq -r '.draft' "$RELEASE_JSON")" = "false"
          test "$(jq -r '.prerelease' "$RELEASE_JSON")" = "true"
          test "$(jq -r '.tag_name' "$RELEASE_JSON")" = "$TAG"
          test "$(jq -r '.target_commitish' "$RELEASE_JSON")" = "$EXPECTED_CANDIDATE_SHA"
          mapfile -t final_assets < <(jq -r '.assets[].name' "$RELEASE_JSON")
          printf '%s\n' "${final_assets[@]}" | grep -Fxq "$APK_NAME"
          printf '%s\n' "${final_assets[@]}" | grep -Fxq "POSE-STUDIO-SHA256SUMS.txt"
          printf '%s\n' "${final_assets[@]}" | grep -Fxq "POSE-STUDIO-SIGNING-CERT-SHA256.txt"
          printf '%s\n' "${final_assets[@]}" | grep -Fxq "POSE-STUDIO-SOURCE-SHA.txt"

          echo "Published Pose Studio commercial-beta prerelease: $TAG -> $TAG_SHA release=$RELEASE_ID apk=$APK_NAME"
