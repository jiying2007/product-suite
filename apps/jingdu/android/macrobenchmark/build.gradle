plugins {
    id "com.android.test"
}

android {
    namespace = "com.junchen.jingdu.macrobenchmark"
    compileSdk = 37

    defaultConfig {
        minSdk = 28
        targetSdk = 36
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        // Hosted emulator numbers are a deterministic regression gate, not a physical-device performance claim.
        testInstrumentationRunnerArguments["androidx.benchmark.suppressErrors"] = "EMULATOR"
        testInstrumentationRunnerArguments["listener"] = "androidx.benchmark.macro.junit4.SideEffectRunListener"
    }

    targetProjectPath = ":app"
    experimentalProperties["android.experimental.self-instrumenting"] = true

    buildTypes {
        benchmark {
            debuggable = true
            signingConfig = signingConfigs.debug
            matchingFallbacks = ["benchmark"]
        }
        profile {
            debuggable = true
            signingConfig = signingConfigs.debug
            matchingFallbacks = ["profile"]
        }
    }
}

dependencies {
    implementation "androidx.benchmark:benchmark-macro-junit4:1.4.1"
    implementation "androidx.test.ext:junit:1.3.0"
    implementation "androidx.test.uiautomator:uiautomator:2.4.0"
}
