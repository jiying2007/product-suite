plugins {
    id "java-library"
    id "com.google.protobuf"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

protobuf {
    protoc { artifact = "com.google.protobuf:protoc:4.36.0" }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java { option "lite" }
                kotlin { option "lite" }
            }
        }
    }
}

dependencies {
    api "com.google.protobuf:protobuf-kotlin-lite:4.36.0"
}
