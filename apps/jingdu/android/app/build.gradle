plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
    id "com.google.devtools.ksp"
}

def applicationIdValue = providers.gradleProperty("jingduApplicationId").getOrElse("com.junchen.jingdu")
def versionCodeProperty = providers.gradleProperty("jingduVersionCode")
def versionNameProperty = providers.gradleProperty("jingduVersionName")
def versionCodeValue = versionCodeProperty.map { Integer.parseInt(it) }.getOrElse(12)
def versionNameValue = versionNameProperty.getOrElse("2.3.6")
def signingPropertiesFile = rootProject.file("keystore.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) signingPropertiesFile.withInputStream { signingProperties.load(it) }
def signingKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def releaseSigningConfigured = signingPropertiesFile.isFile() && signingKeys.every { key ->
    def value = signingProperties.getProperty(key); value != null && !value.trim().isEmpty()
}

android {
    namespace = "com.junchen.jingdu"
    compileSdk = 37
    ndkVersion = "29.0.14206865"
    defaultConfig {
        applicationId = applicationIdValue; minSdk = 26; targetSdk = 36; versionCode = versionCodeValue; versionName = versionNameValue
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }
        externalNativeBuild { cmake { cppFlags "-std=c++17 -Wall -Wextra -Wpedantic" } }
    }
    signingConfigs {
        if (releaseSigningConfigured) release {
            storeFile = file(signingProperties.getProperty("storeFile")); storePassword = signingProperties.getProperty("storePassword")
            keyAlias = signingProperties.getProperty("keyAlias"); keyPassword = signingProperties.getProperty("keyPassword")
        }
    }
    buildTypes {
        debug { applicationIdSuffix = ".debug"; versionNameSuffix = "-debug" }
        release {
            minifyEnabled = true; shrinkResources = true
            ndk { debugSymbolLevel = "FULL" }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (releaseSigningConfigured) signingConfig = signingConfigs.release
        }
        // Macrobenchmark SLO target: production-like DEX/resource layout, but debug-signed for hosted CI.
        benchmark {
            initWith release; signingConfig = signingConfigs.debug; matchingFallbacks = ["release"]
            debuggable = false; minifyEnabled = true; shrinkResources = true
        }
        // Baseline/Startup Profile collection must remain non-obfuscated so HRF method names are stable.
        // It is deliberately a different target from the R8 benchmark measured above.
        profile {
            initWith release; signingConfig = signingConfigs.debug; matchingFallbacks = ["release"]
            debuggable = false; minifyEnabled = false; shrinkResources = false
        }
    }
    sourceSets {
        main { assets.srcDir rootProject.file("../../third_party") }
        // Hosted-only fixture/provider/profileable manifest are shared by both CI target variants and
        // never enter the production release source set. AGP 9 built-in Kotlin has an independent
        // Kotlin source directory; java.srcDir alone does not compile the benchmark .kt provider.
        profile {
            java.srcDir "src/benchmark/java"
            kotlin.srcDir "src/benchmark/java"
            manifest.srcFile "src/benchmark/AndroidManifest.xml"
        }
    }
    buildFeatures { compose = true; buildConfig = false }
    androidResources { generateLocaleConfig = true }
    externalNativeBuild { cmake { path = file("src/main/cpp/CMakeLists.txt"); version = "3.22.1" } }
    lint { abortOnError = true; checkReleaseBuilds = true }
    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
    packaging { resources { excludes += ["/META-INF/{AL2.0,LGPL2.1}"] } }
}

kotlin { compilerOptions { freeCompilerArgs.add("-opt-in=androidx.compose.material3.ExperimentalMaterial3Api") } }

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2026.08.00")
    implementation project(":readerproto")
    implementation composeBom
    androidTestImplementation composeBom
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material3.adaptive:adaptive:1.3.0"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.core:core-ktx:1.19.0"
    implementation "androidx.datastore:datastore:1.2.1"
    implementation "androidx.room3:room3-runtime:3.0.2"
    implementation "androidx.sqlite:sqlite-bundled:2.7.0"
    ksp "androidx.room3:room3-compiler:3.0.2"
    implementation "androidx.media3:media3-common:1.11.0"
    implementation "androidx.media3:media3-session:1.11.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.11.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"
    implementation "io.github.laisuk:openccjava:1.4.2"
    implementation "com.android.billingclient:billing:9.1.0"
    implementation "com.google.android.play:review:2.0.2"
    debugImplementation "androidx.compose.ui:ui-tooling"
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
}

tasks.register("validateStoreRelease") {
    group = "verification"
    doLast {
        if (applicationIdValue != "com.junchen.jingdu") throw new GradleException("production applicationId is fixed to com.junchen.jingdu")
        if (!versionCodeProperty.isPresent() || versionCodeValue <= 0) throw new GradleException("set explicit positive -PjingduVersionCode")
        if (!versionNameProperty.isPresent() || !(versionNameValue ==~ /\d+\.\d+\.\d+/)) throw new GradleException("set semantic -PjingduVersionName")
        if (!releaseSigningConfigured) throw new GradleException("configure ignored keystore.properties")
        if (!file(signingProperties.getProperty("storeFile")).isFile()) throw new GradleException("upload keystore missing")
    }
}
