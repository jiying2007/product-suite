plugins {
    id "com.android.test"
}

android {
    namespace = "com.junchen.posestudio.macrobenchmark"
    compileSdk = 37
    targetProjectPath = ":app"

    defaultConfig {
        minSdk = 26
        targetSdk = 36
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments["androidx.benchmark.enabledRules"] = "Macrobenchmark"
        testInstrumentationRunnerArguments["listener"] = "androidx.benchmark.macro.junit4.SideEffectRunListener"
    }

    buildTypes {
        benchmark {
            debuggable = true
            matchingFallbacks = ["release"]
        }
    }

    experimentalProperties["android.experimental.self-instrumenting"] = true
}

dependencies {
    implementation "androidx.benchmark:benchmark-macro-junit4:1.5.0"
    implementation "androidx.test.ext:junit:1.3.0"
    implementation "androidx.test.uiautomator:uiautomator:2.4.0"
}
