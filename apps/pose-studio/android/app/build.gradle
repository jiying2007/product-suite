plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
}

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file("keystore.properties")
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

android {
    namespace = "com.junchen.posestudio"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.junchen.posestudio"
        minSdk = 26
        targetSdk = 36
        versionCode = 2
        versionName = "0.2.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (releaseSigningPropertiesFile.exists()) {
            release {
                storeFile = file(releaseSigningProperties.getProperty("storeFile"))
                storePassword = releaseSigningProperties.getProperty("storePassword")
                keyAlias = releaseSigningProperties.getProperty("keyAlias")
                keyPassword = releaseSigningProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (releaseSigningPropertiesFile.exists()) signingConfig = signingConfigs.release
        }
    }

    buildFeatures { compose = true }
    lint {
        abortOnError = true
        checkReleaseBuilds = true
        textReport = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    packaging { resources { excludes += ["/META-INF/{AL2.0,LGPL2.1}"] } }
}

tasks.register("validatePoseReleaseSigning") {
    group = "verification"
    doLast {
        if (!releaseSigningPropertiesFile.exists()) throw new GradleException("keystore.properties is required for a distributable Pose Studio release")
        ["storeFile", "storePassword", "keyAlias", "keyPassword"].each { key ->
            if (!releaseSigningProperties.getProperty(key)) throw new GradleException("Missing release signing property: ${key}")
        }
        if (!file(releaseSigningProperties.getProperty("storeFile")).exists()) throw new GradleException("Pose Studio release keystore does not exist")
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2026.08.00")
    implementation composeBom
    androidTestImplementation composeBom

    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.core:core-ktx:1.19.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.11.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"

    debugImplementation "androidx.compose.ui:ui-tooling"
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:core:1.7.0"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
