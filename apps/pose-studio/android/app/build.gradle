plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
}

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file("keystore.properties")
def releaseSigningEnvironment = [
    storeFile: System.getenv("POSE_STUDIO_RELEASE_STORE_FILE"),
    storePassword: System.getenv("POSE_STUDIO_RELEASE_STORE_PASSWORD"),
    keyAlias: System.getenv("POSE_STUDIO_RELEASE_KEY_ALIAS"),
    keyPassword: System.getenv("POSE_STUDIO_RELEASE_KEY_PASSWORD"),
]
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
} else {
    releaseSigningEnvironment.each { key, value ->
        if (value) releaseSigningProperties.setProperty(key, value)
    }
}
def releaseSigningKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def releaseSigningComplete = releaseSigningKeys.every { key ->
    def value = releaseSigningProperties.getProperty(key)
    value != null && !value.trim().isEmpty()
} && file(releaseSigningProperties.getProperty("storeFile")).isFile()

android {
    namespace = "com.junchen.posestudio"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.junchen.posestudio"
        minSdk = 26
        targetSdk = 36
        versionCode = 3
        versionName = "0.2.1"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (releaseSigningComplete) {
            release {
                storeFile = file(releaseSigningProperties.getProperty("storeFile"))
                storePassword = releaseSigningProperties.getProperty("storePassword")
                keyAlias = releaseSigningProperties.getProperty("keyAlias")
                keyPassword = releaseSigningProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (releaseSigningComplete) signingConfig = signingConfigs.release
        }
        benchmark {
            initWith release
            debuggable = false
            signingConfig = signingConfigs.debug
            matchingFallbacks = ["release"]
        }
    }

    buildFeatures { compose = true }
    lint {
        abortOnError = true
        checkReleaseBuilds = true
        textReport = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    packaging { resources { excludes += ["/META-INF/{AL2.0,LGPL2.1}"] } }
}

tasks.register("validatePoseReleaseSigning") {
    group = "verification"
    doLast {
        releaseSigningKeys.each { key ->
            if (!releaseSigningProperties.getProperty(key)) {
                throw new GradleException("Missing Pose Studio release signing property: ${key}")
            }
        }
        def keystore = file(releaseSigningProperties.getProperty("storeFile"))
        if (!keystore.isFile()) throw new GradleException("Pose Studio release keystore does not exist: ${keystore}")
        if (!releaseSigningComplete) throw new GradleException("Pose Studio release signing configuration is incomplete")
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2026.08.00")
    implementation composeBom
    androidTestImplementation composeBom

    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.core:core-ktx:1.19.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.11.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"

    debugImplementation "androidx.compose.ui:ui-tooling"
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:core:1.7.0"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
